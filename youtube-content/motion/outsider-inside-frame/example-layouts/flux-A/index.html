      :root { --W: 1920px; --H: 1080px; --paper: #F4F0E6; --paper-deep: #E8E1D0; --ink: #1B2230; --ink-soft: #4A5263;
               --graphite: #8C877A; --red: #C4301C; }

      #root { position: relative; width: var(--W); height: var(--H); background: var(--paper); color: var(--ink);
              font-family: 'IBM Plex Sans', system-ui, sans-serif; container-type: size; overflow: hidden; }
      .grain { position: absolute; inset: 0; background: url(assets/textures/paper-grain-16x9.png);

               font-size: 40px; line-height: 1.32; color: var(--ink-soft); }

      :root[data-aspect="9x16"] .slip { padding: 12px 22px; line-height: 1.25; }

      .stamp { position: absolute; transform: rotate(calc(-6deg + var(--stamp-rot, 0deg))); border: 7px solid var(--red); border-radius: 2px; color: var(--red);

  <body>
    <div id="root" class="oi-c" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div class="grain"></div>

      <div class="kick mono up" id="kick"><span class="sect">§</span><span data-chrome="chapter">03 · La FIV</span></div>
      <div class="ttl serif" id="ttl" data-chrome="ftitle">La FIV, étape par étape</div>
      <div class="step mono" id="s1" data-chrome="s1">01</div>
      <div class="node sans" id="n1" data-chrome="n1">Stimulation</div>
      <div class="step mono" id="s2" data-chrome="s2">02</div>
      <div class="node sans" id="n2" data-chrome="n2">Ponction</div>
      <div class="step mono" id="s3" data-chrome="s3">03</div>
      <div class="node sans" id="n3" data-chrome="n3">Fécondation</div>
      <div class="step mono" id="s4" data-chrome="s4">04</div>
      <div class="node sans" id="n4" data-chrome="n4">Transfert</div>
      <!-- ink lines: rough.js (assets/ink/ink.js), seeded per video; drawn on below. Black ink only — the red pen is never generated -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const rise = (sel, t, d = 0.45) =>
        tl.fromTo(sel, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: d, ease: 'power3.out' }, t);

      rise('#kick', 0.2, 0.35); rise('#ttl', 0.4);
      const ink = oiInk.layer('#root'); const port = document.documentElement.dataset.aspect === '9x16';
      let t = 1.0;
      for (let i = 1; i <= 4; i++) {
        const b = ink.boxAround('#n' + i, 4); ink.draw(tl, b, t, 0.55);
        rise('#n' + i, t + 0.3, 0.4); rise('#s' + i, t + 0.1, 0.35);
        if (i < 4) {
          const a = ink.rectOf('#n' + i), c = ink.rectOf('#n' + (i + 1));
          const arr = port ? ink.arrow([[a.x + a.w / 2, a.y + a.h + 18], [c.x + c.w / 2, c.y - 18]], { bend: 22 })
                           : ink.arrow([[a.x + a.w + 18, a.y + a.h / 2], [c.x - 18, c.y + c.h / 2]], { bend: -16 });
          ink.draw(tl, arr, t + 0.7, 0.4);
        }
        t += 1.05;
      }
      tl.to({}, { duration: 0.01 }, 9.99);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
