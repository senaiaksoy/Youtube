<!doctype html>
<html lang="fr" data-ink-seed="34817">
  <!-- Layout « schema-A » — Au labo (schema-A).
       One source, two aspects: this file is 1920×1080; `node ../../tools/aspect.mjs .` writes shorts/ (1080×1920)
       from it, using the :root[data-aspect="9x16"] rules below. Facts: node ../../tools/facts.mjs all . --lang fr
       · phone floor + Shorts UI zone: node ../../tools/legibility.mjs . (and shorts/) -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/pen/pen.css" />
    <link rel="stylesheet" href="assets/papers/papers.css" />
    <link rel="stylesheet" href="assets/components/components.css" />
    <style>
      :root { --W: 1920px; --H: 1080px; --paper: #EFEBE1; --paper-deep: #E8E1D0; --ink: #1B2230; --ink-soft: #4A5263;
               --graphite: #8C877A; --red: #C4301C; }
      :root[data-aspect="9x16"] { --W: 1080px; --H: 1920px; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--W); height: var(--H); overflow: hidden; background: var(--paper); }
      #root { position: relative; width: var(--W); height: var(--H); background: var(--paper); color: var(--ink);
              font-family: 'IBM Plex Sans', system-ui, sans-serif; container-type: size; overflow: hidden; }
      .grain { position: absolute; inset: 0; background: url(assets/textures/paper-grain-16x9.png);
               mix-blend-mode: soft-light; opacity: 0; pointer-events: none; }
      :root[data-aspect="9x16"] .grain { background-image: url(assets/textures/paper-grain-9x16.png); }
      .only-916 { display: none; }
      :root[data-aspect="9x16"] .only-916 { display: block; }
      :root[data-aspect="9x16"] .only-169 { display: none; }
      .serif { font-family: 'Literata', Georgia, serif; }
      .mono  { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
      .sans  { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
      .up    { text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
      .sect  { color: var(--red); margin-right: .45em; }
      .mk    { font-family: 'IBM Plex Mono', monospace; font-size: 40px; font-weight: 500; color: var(--ink-soft); margin-left: 14px; letter-spacing: 0; }
      .slip  { position: absolute; background: var(--paper-deep); border: 1px solid rgba(27,34,48,.14); border-radius: 2px;
               box-shadow: 0 1px 0 rgba(27,34,48,.10); padding: 16px 26px; font-family: 'IBM Plex Mono', monospace;
               font-size: 40px; line-height: 1.32; color: var(--ink-soft); }
      .slip .t { color: var(--ink); font-weight: 500; }
      :root[data-aspect="9x16"] .slip { padding: 12px 22px; line-height: 1.25; }
      .num   { font-weight: 600; letter-spacing: -.03em; font-variant-numeric: lining-nums tabular-nums; }
      .stamp { position: absolute; transform: rotate(calc(-6deg + var(--stamp-rot, 0deg))); border: 7px solid var(--red); border-radius: 2px; color: var(--red);
               font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 70px; letter-spacing: .08em; padding: 14px 34px;
               mix-blend-mode: multiply; -webkit-mask-image: url(assets/textures/stamp-mask.png); mask-image: url(assets/textures/stamp-mask.png);
               -webkit-mask-size: 100% 100%; mask-size: 100% 100%; white-space: nowrap; }
      :lang(tr) .stamp { font-size: 60px; }

      /* lab-spiral geometry: header cells 110–441 | 441–1764 (y 52–132); rules every 72 px from 232; spiral at x 1794 */
      .cell { position: absolute; top: 52px; height: 80px; display: flex; align-items: center; font-size: 40px; }
      .cell-a { left: 110px; width: 331px; justify-content: center; }
      .cell-b { left: 441px; width: 1323px; padding-left: 32px; }
      .ttl { left: 160px; --y: 304px; --fs: 56px; --lh: 72px; font-weight: 500; letter-spacing: -.01em; }
      /* one common scale for every plate: relative sizes stay true to the drawing */
      .lbl { width: 340px; text-align: center; white-space: nowrap; --y: 808px; --fs: 40px; color: var(--ink-soft); }
      .credit { left: 160px; --y: 952px; --fs: 40px; color: var(--ink-soft); }
      #pl0 { left: 160px; top: 502px; width: 169px; }  #lb0 { left: 75px; }
      #pl1 { left: 400px; top: 442px; width: 238px; }  #lb1 { left: 350px; }
      #pl2 { left: 710px; top: 401px; width: 319px; }  #lb2 { left: 699px; }
      #pl3 { left: 1100px; top: 363px; width: 239px; }  #lb3 { left: 1049px; }
      #pl4 { left: 1410px; top: 418px; width: 290px; }  #lb4 { left: 1385px; }
      /* ---- 9:16 (Shorts): bottom 18 % and the right icon column stay free of text ---- */
      :root[data-aspect="9x16"] .cell { top: 110px; height: 90px; }
      :root[data-aspect="9x16"] .cell-a { left: 98px; width: 132px; }
      :root[data-aspect="9x16"] .cell-b { left: 230px; width: 694px; padding-left: 20px; letter-spacing: .02em; }
      :root[data-aspect="9x16"] .ttl { left: 130px; width: 780px; --y: 300px; --fs: 52px; }
      :root[data-aspect="9x16"] .credit { left: 130px; width: 780px; --y: 1380px; --lh: 72px; }
      :root[data-aspect="9x16"] #pl0 { left: 247px; top: 379px; width: 106px; }
      :root[data-aspect="9x16"] #lb0 { left: 470px; --y: 444px; text-align: left; width: 440px; }
      :root[data-aspect="9x16"] #pl1 { left: 225px; top: 558px; width: 150px; }
      :root[data-aspect="9x16"] #lb1 { left: 470px; --y: 660px; text-align: left; width: 440px; }
      :root[data-aspect="9x16"] #pl2 { left: 200px; top: 748px; width: 201px; }
      :root[data-aspect="9x16"] #lb2 { left: 470px; --y: 876px; text-align: left; width: 440px; }
      :root[data-aspect="9x16"] #pl3 { left: 225px; top: 940px; width: 150px; }
      :root[data-aspect="9x16"] #lb3 { left: 470px; --y: 1092px; text-align: left; width: 440px; }
      :root[data-aspect="9x16"] #pl4 { left: 209px; top: 1191px; width: 182px; }
      :root[data-aspect="9x16"] #lb4 { left: 470px; --y: 1308px; text-align: left; width: 440px; }
    </style>
  </head>
  <body>
    <div id="root" class="oi-c" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div class="grain"></div>

      <div class="ground ground--lab-spiral"></div>
      <div class="cell cell-a mono up" id="num"><span data-chrome="num">§ 04</span></div>
      <div class="cell cell-b mono up" id="head"><span data-chrome="head">Au labo · Le follicule</span></div>
      <div class="on-rule serif ttl" id="ttl" data-chrome="stitle">Du follicule au corps jaune</div>
      <img class="plate" id="pl0" src="assets/schema/servier-ovary-cycle/01-primordial.png" alt="" />
      <div class="on-rule sans lbl" id="lb0" data-chrome="l1">Primordial</div>
      <img class="plate" id="pl1" src="assets/schema/servier-ovary-cycle/05-antral.png" alt="" />
      <div class="on-rule sans lbl" id="lb1" data-chrome="l2">Antral</div>
      <img class="plate" id="pl2" src="assets/schema/servier-ovary-cycle/06-preovulatory.png" alt="" />
      <div class="on-rule sans lbl" id="lb2" data-chrome="l3">Préovulatoire</div>
      <img class="plate" id="pl3" src="assets/schema/servier-ovary-cycle/07-ovulation.png" alt="" />
      <div class="on-rule sans lbl" id="lb3" data-chrome="l4">Ovulation</div>
      <img class="plate" id="pl4" src="assets/schema/servier-ovary-cycle/09-corpus-luteum.png" alt="" />
      <div class="on-rule sans lbl" id="lb4" data-chrome="l5">Corps jaune</div>
      <!-- the plate is somebody else's drawing: its credit is on screen for as long as the plates are -->
      <div class="on-rule mono credit" id="credit" data-chrome="credit">Schéma adapté de Servier Medical Art · CC BY 4.0</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const rise = (sel, t, d = 0.45) =>
        tl.fromTo(sel, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: d, ease: 'power3.out' }, t);

      rise('#num', 0.2, 0.35); rise('#head', 0.3, 0.35); rise('#ttl', 0.5); rise('#credit', 0.8, 0.4);
      // each stage is printed onto the page top → bottom, in the order the follicle lives it
      tl.fromTo('#pl0', { '--p': 0 }, { '--p': 1, duration: 0.7, ease: 'power1.inOut' }, 1.0); rise('#lb0', 1.35, 0.4);
      tl.fromTo('#pl1', { '--p': 0 }, { '--p': 1, duration: 0.7, ease: 'power1.inOut' }, 1.8); rise('#lb1', 2.15, 0.4);
      tl.fromTo('#pl2', { '--p': 0 }, { '--p': 1, duration: 0.7, ease: 'power1.inOut' }, 2.6); rise('#lb2', 2.95, 0.4);
      tl.fromTo('#pl3', { '--p': 0 }, { '--p': 1, duration: 0.7, ease: 'power1.inOut' }, 3.4); rise('#lb3', 3.75, 0.4);
      tl.fromTo('#pl4', { '--p': 0 }, { '--p': 1, duration: 0.7, ease: 'power1.inOut' }, 4.2); rise('#lb4', 4.55, 0.4);
      tl.to({}, { duration: 0.01 }, 9.99);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
