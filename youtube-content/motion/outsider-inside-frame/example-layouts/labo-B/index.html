<!doctype html>
<html lang="fr">
  <!-- Série « Au labo (labo-B) » — ground: plain paper-grain.
       One source, two aspects: this file is 1920×1080; `node ../../tools/aspect.mjs .` writes shorts/ (1080×1920)
       from it, using the :root[data-aspect="9x16"] rules below. Facts: node ../../tools/facts.mjs all . --lang fr
       · phone floor + Shorts UI zone: node ../../tools/legibility.mjs . (and shorts/) -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/pen/pen.css" />
    <link rel="stylesheet" href="assets/papers/papers.css" />
    <link rel="stylesheet" href="assets/components/components.css" />
    <style>
      :root { --W: 1920px; --H: 1080px; --paper: #121820; --paper-deep: #E8E1D0; --ink: #1B2230; --ink-soft: #4A5263;
               --graphite: #8C877A; --red: #C4301C; }
      :root[data-aspect="9x16"] { --W: 1080px; --H: 1920px; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--W); height: var(--H); overflow: hidden; background: var(--paper); }
      #root { position: relative; width: var(--W); height: var(--H); background: var(--paper); color: var(--ink);
              font-family: 'IBM Plex Sans', system-ui, sans-serif; container-type: size; overflow: hidden; }
      .grain { position: absolute; inset: 0; background: url(assets/textures/paper-grain-16x9.png);
               mix-blend-mode: soft-light; opacity: 0; pointer-events: none; }
      :root[data-aspect="9x16"] .grain { background-image: url(assets/textures/paper-grain-9x16.png); }
      .only-916 { display: none; }
      :root[data-aspect="9x16"] .only-916 { display: block; }
      :root[data-aspect="9x16"] .only-169 { display: none; }
      .serif { font-family: 'Literata', Georgia, serif; }
      .mono  { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
      .sans  { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
      .up    { text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
      .sect  { color: var(--red); margin-right: .45em; }
      .mk    { font-family: 'IBM Plex Mono', monospace; font-size: 40px; font-weight: 500; color: var(--ink-soft); margin-left: 14px; letter-spacing: 0; }
      .slip  { position: absolute; background: var(--paper-deep); border: 1px solid rgba(27,34,48,.14); border-radius: 2px;
               box-shadow: 0 1px 0 rgba(27,34,48,.10); padding: 16px 26px; font-family: 'IBM Plex Mono', monospace;
               font-size: 40px; line-height: 1.32; color: var(--ink-soft); }
      .slip .t { color: var(--ink); font-weight: 500; }
      :root[data-aspect="9x16"] .slip { padding: 12px 22px; line-height: 1.25; }
      .num   { font-weight: 600; letter-spacing: -.03em; font-variant-numeric: lining-nums tabular-nums; }
      .stamp { position: absolute; transform: rotate(-6deg); border: 7px solid var(--red); border-radius: 2px; color: var(--red);
               font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 70px; letter-spacing: .08em; padding: 14px 34px;
               mix-blend-mode: multiply; -webkit-mask-image: url(assets/textures/stamp-mask.png); mask-image: url(assets/textures/stamp-mask.png);
               -webkit-mask-size: 100% 100%; mask-size: 100% 100%; white-space: nowrap; }
      :lang(tr) .stamp { font-size: 60px; }

      .foot { position: absolute; inset: 0; background: #121820 url(assets/footage/lab/lab-10-incubators-c60.jpg) center / cover no-repeat;
              transform-origin: 40% 50%; }
      .tab { position: absolute; left: 88px; bottom: 88px; background: #1D252E; color: #F4F0E6; padding: 12px 22px; font-size: 40px;
             line-height: 1.25; border-radius: 2px; }   /* = components.css .footage-tab */
      .card { position: absolute; right: 88px; top: 110px; width: 780px; background: #F4F0E6; padding: 26px 32px 24px;
              border-radius: 2px; box-shadow: 0 1px 0 rgba(0,0,0,.25); }
      .card .k { font-size: 40px; letter-spacing: .04em; line-height: 1.2; }
      .card .row { display: flex; align-items: baseline; gap: 24px; margin-top: 18px; }
      .card .row .n { font-size: 104px; line-height: 1; flex: none; }
      .card .row .l { font-size: 40px; line-height: 1.2; color: var(--ink-soft); }
      .card .cite { margin-top: 22px; padding-top: 16px; border-top: 1px solid rgba(27,34,48,.2); font-family: 'IBM Plex Mono', monospace;
                    font-size: 40px; line-height: 1.25; color: var(--ink-soft); }
      .card .cite .t { color: var(--ink); font-weight: 500; }
      /* ---- 9:16 (Shorts): bottom 18 % and the right icon column stay free of text ---- */
      :root[data-aspect="9x16"] .foot { background-image: url(assets/footage/lab/lab-06-cryo-tank.jpg); }
      :root[data-aspect="9x16"] .card { left: 64px; right: 64px; width: auto; top: 140px; }
      :root[data-aspect="9x16"] .tab { left: 64px; bottom: auto; top: 1400px; max-width: 880px; line-height: 1.25; }
    </style>
  </head>
  <body>
    <div id="root" class="oi-c" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div class="grain"></div>

      <div class="foot" id="foot"></div>
      <div class="card" id="card">
        <div class="k mono up" data-fact="K1">Naissances vivantes par transfert</div>
        <div class="row"><div class="n serif num" data-fact="F2">58,5 %</div><div class="l" data-fact="F2" data-field="label">Transfert guidé par l’ERA</div></div>
        <div class="row"><div class="n serif num" data-fact="F3">61,9 %</div><div class="l" data-fact="F3" data-field="label">Transfert à horaire standard</div></div>
        <div class="cite"><div class="t" data-ref="R1">[1] Doyle N, et al. JAMA. 2022;328(21):2117-25</div><div data-ref="R1" data-field="design">Essai randomisé multicentrique · n = 767</div></div>
      </div>
      <div class="tab mono" id="tab" data-chrome="footage">Laboratoire FIV · image réelle</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const rise = (sel, t, d = 0.45) =>
        tl.fromTo(sel, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: d, ease: 'power3.out' }, t);

      // one slow push-in on the still, nothing else moves the picture
      tl.fromTo('#foot', { scale: 1 }, { scale: 1.04, duration: 10, ease: 'none' }, 0);
      rise('#tab', 0.6, 0.4);
      rise('#card', 2.0, 0.5);
      tl.to({}, { duration: 0.01 }, 9.99);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
