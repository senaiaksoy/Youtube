<!doctype html>
<html lang="fr" data-aspect="9x16">
  <!-- Layout « fin » — End screen (fin).
       One source, two aspects: this file is 1920×1080; `node ../../tools/aspect.mjs .` writes shorts/ (1080×1920)
       from it, using the :root[data-aspect="9x16"] rules below. Facts: node ../../tools/facts.mjs all . --lang fr
       · phone floor + Shorts UI zone: node ../../tools/legibility.mjs . (and shorts/) -->
  <head>
    <!-- GENERATED by tools/aspect.mjs from ../index.html — edit the source, not this file -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/ink/rough-4.6.6.js"></script>
    <script src="assets/ink/ink.js"></script>
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/pen/pen.css" />
    <link rel="stylesheet" href="assets/papers/papers.css" />
    <link rel="stylesheet" href="assets/components/components.css" />
    <style>
      :root { --W: 1920px; --H: 1080px; --paper: #F4F0E6; --paper-deep: #E8E1D0; --ink: #1B2230; --ink-soft: #4A5263;
               --graphite: #8C877A; --red: #C4301C; }
      :root[data-aspect="9x16"] { --W: 1080px; --H: 1920px; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--W); height: var(--H); overflow: hidden; background: var(--paper); }
      #root { position: relative; width: var(--W); height: var(--H); background: var(--paper); color: var(--ink);
              font-family: 'IBM Plex Sans', system-ui, sans-serif; container-type: size; overflow: hidden; }
      .grain { position: absolute; inset: 0; background: url(assets/textures/paper-grain-16x9.png);
               mix-blend-mode: soft-light; opacity: .35; pointer-events: none; }
      :root[data-aspect="9x16"] .grain { background-image: url(assets/textures/paper-grain-9x16.png); }
      .only-916 { display: none; }
      :root[data-aspect="9x16"] .only-916 { display: block; }
      :root[data-aspect="9x16"] .only-169 { display: none; }
      .serif { font-family: 'Literata', Georgia, serif; }
      .mono  { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
      .sans  { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
      .up    { text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
      .sect  { color: var(--red); margin-right: .45em; }
      .mk    { font-family: 'IBM Plex Mono', monospace; font-size: 40px; font-weight: 500; color: var(--ink-soft); margin-left: 14px; letter-spacing: 0; }
      .slip  { position: absolute; background: var(--paper-deep); border: 1px solid rgba(27,34,48,.14); border-radius: 2px;
               box-shadow: 0 1px 0 rgba(27,34,48,.10); padding: 16px 26px; font-family: 'IBM Plex Mono', monospace;
               font-size: 40px; line-height: 1.32; color: var(--ink-soft); }
      .slip .t { color: var(--ink); font-weight: 500; }
      :root[data-aspect="9x16"] .slip { padding: 12px 22px; line-height: 1.25; }
      .num   { font-weight: 600; letter-spacing: -.03em; font-variant-numeric: lining-nums tabular-nums; }
      .stamp { position: absolute; transform: rotate(calc(-6deg + var(--stamp-rot, 0deg))); border: 7px solid var(--red); border-radius: 2px; color: var(--red);
               font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 70px; letter-spacing: .08em; padding: 14px 34px;
               mix-blend-mode: multiply; -webkit-mask-image: url(assets/textures/stamp-mask.png); mask-image: url(assets/textures/stamp-mask.png);
               -webkit-mask-size: 100% 100%; mask-size: 100% 100%; white-space: nowrap; }
      :lang(tr) .stamp { font-size: 60px; }

      .slot { position: absolute; width: 613px; height: 343px; }          /* YouTube video / playlist element goes here */
      #slotA { left: 240px; top: 220px; } #slotB { left: 240px; top: 633px; }
      .sub-slot { position: absolute; left: 1091px; top: 500px; width: 298px; height: 298px; }   /* YouTube subscribe element */
      .fk  { position: absolute; left: 1000px; top: 200px; font-size: 40px; }
      .ft  { position: absolute; left: 1000px; top: 262px; width: 740px; font-size: 64px; font-weight: 500; line-height: 1.12; letter-spacing: -.01em; }
      .sl  { position: absolute; left: 1420px; top: 596px; font-size: 48px; }
      .hd  { position: absolute; left: 1420px; top: 664px; font-size: 40px; color: var(--ink-soft); }
      .arw { left: 878px; top: 420px; width: 190px; height: auto; --dir: 270deg; }
      .short-cue { display: none; }
      /* ---- 9:16 (Shorts): bottom 18 % and the right icon column stay free of text ---- */
      :root[data-aspect="9x16"] .slot, :root[data-aspect="9x16"] .sub-slot, :root[data-aspect="9x16"] .sl, :root[data-aspect="9x16"] .hd, :root[data-aspect="9x16"] .arw { display: none; }
      :root[data-aspect="9x16"] .fk { left: 96px; top: 300px; }
      :root[data-aspect="9x16"] .ft { left: 96px; top: 362px; width: 880px; font-size: 68px; }
      :root[data-aspect="9x16"] .short-cue { display: block; position: absolute; left: 96px; top: 1080px; width: 860px; font-size: 56px; line-height: 1.2; font-weight: 500; }
      :root[data-aspect="9x16"] .arw-d { display: block; left: 470px; top: 1290px; width: 110px; height: auto; --dir: 180deg; }
    </style>
  </head>
  <body>
    <div id="root" class="oi-c" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
      <div class="grain"></div>

      <div class="slot" id="slotA" aria-hidden="true"></div>
      <div class="slot" id="slotB" aria-hidden="true"></div>
      <div class="sub-slot" id="subSlot" aria-hidden="true"></div>
      <div class="fk mono up" id="fk"><span class="sect">§</span><span data-chrome="fkick">À voir ensuite</span></div>
      <div class="ft serif" id="ft" data-chrome="ftitle2">Deux vidéos pour aller plus loin.</div>
      <div class="sl sans" id="sl" data-chrome="sub">Abonnez-vous</div>
      <div class="hd mono" id="hd" data-chrome="handle">@SenaiAksoy</div>
      <img class="pen hand arw only-169" id="arw" src="assets/hand/arrow-left-02.png" alt="" />
      <div class="short-cue serif only-916" id="cue" data-chrome="fshort">La vidéo complète : le lien juste en dessous.</div>
      <img class="pen hand arw-d only-916" id="arwD" src="assets/hand/arrow-down-01.png" alt="" />
      <audio data-sfx="pen" id="sfx-pen" data-start="3.0" data-duration="0.55" data-track-index="10" data-volume="0.9" src="assets/sfx/pen-01.wav"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const rise = (sel, t, d = 0.45) =>
        tl.fromTo(sel, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: d, ease: 'power3.out' }, t);

      rise('#fk', 0.3, 0.35); rise('#ft', 0.6);
      const ink = oiInk.layer('#root'); const port = document.documentElement.dataset.aspect === '9x16';
      if (!port) {
        // ink frames just OUTSIDE the slots (YouTube draws its elements inside them)
        ink.draw(tl, ink.boxAround('#slotA', 18), 1.0, 0.6);
        ink.draw(tl, ink.boxAround('#slotB', 18), 1.5, 0.6);
        const c = ink.rectOf('#subSlot');
        ink.draw(tl, ink.ellipse(c.x + c.w / 2, c.y + c.h / 2, c.w + 44, c.h + 44), 2.0, 0.6);
        rise('#sl', 2.4, 0.4); rise('#hd', 2.55, 0.4);
        tl.fromTo('#arw', { '--p': 0 }, { '--p': 1, duration: 0.5, ease: 'power2.out' }, 3.0);
      } else {
        rise('#cue', 1.2, 0.45);
        tl.fromTo('#arwD', { '--p': 0 }, { '--p': 1, duration: 0.5, ease: 'power2.out' }, 3.0);
      }
      tl.to({}, { duration: 0.01 }, 19.99);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
