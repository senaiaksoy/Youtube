<!doctype html>
<html lang="fr">
  <!-- Component reference « notes » (frame.md § Components; styles in assets/components/components.css).
       One source, two aspects: this file is 1920×1080; `node ../../tools/aspect.mjs .` writes shorts/ (1080×1920)
       from it, using the :root[data-aspect="9x16"] rules below. Facts: node ../../tools/facts.mjs all . --lang fr
       · phone floor + Shorts UI zone: node ../../tools/legibility.mjs . (and shorts/) -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/pen/pen.css" />
    <link rel="stylesheet" href="assets/papers/papers.css" />
    <link rel="stylesheet" href="assets/components/components.css" />
    <style>
      :root { --W: 1920px; --H: 1080px; --paper: #F4F0E6; --paper-deep: #E8E1D0; --ink: #1B2230; --ink-soft: #4A5263;
               --graphite: #8C877A; --red: #C4301C; }
      :root[data-aspect="9x16"] { --W: 1080px; --H: 1920px; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--W); height: var(--H); overflow: hidden; background: var(--paper); }
      #root { position: relative; width: var(--W); height: var(--H); background: var(--paper); color: var(--ink);
              font-family: 'IBM Plex Sans', system-ui, sans-serif; container-type: size; overflow: hidden; }
      .grain { position: absolute; inset: 0; background: url(assets/textures/paper-grain-16x9.png);
               mix-blend-mode: soft-light; opacity: .35; pointer-events: none; }
      :root[data-aspect="9x16"] .grain { background-image: url(assets/textures/paper-grain-9x16.png); }
      .only-916 { display: none; }
      :root[data-aspect="9x16"] .only-916 { display: block; }
      :root[data-aspect="9x16"] .only-169 { display: none; }
      .serif { font-family: 'Literata', Georgia, serif; }
      .mono  { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
      .sans  { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
      .up    { text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
      .sect  { color: var(--red); margin-right: .45em; }
      .mk    { font-family: 'IBM Plex Mono', monospace; font-size: 40px; font-weight: 500; color: var(--ink-soft); margin-left: 14px; letter-spacing: 0; }
      .slip  { position: absolute; background: var(--paper-deep); border: 1px solid rgba(27,34,48,.14); border-radius: 2px;
               box-shadow: 0 1px 0 rgba(27,34,48,.10); padding: 16px 26px; font-family: 'IBM Plex Mono', monospace;
               font-size: 40px; line-height: 1.32; color: var(--ink-soft); }
      .slip .t { color: var(--ink); font-weight: 500; }
      :root[data-aspect="9x16"] .slip { padding: 12px 22px; line-height: 1.25; }
      .num   { font-weight: 600; letter-spacing: -.03em; font-variant-numeric: lining-nums tabular-nums; }
      .stamp { position: absolute; transform: rotate(-6deg); border: 7px solid var(--red); border-radius: 2px; color: var(--red);
               font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 70px; letter-spacing: .08em; padding: 14px 34px;
               mix-blend-mode: multiply; -webkit-mask-image: url(assets/textures/stamp-mask.png); mask-image: url(assets/textures/stamp-mask.png);
               -webkit-mask-size: 100% 100%; mask-size: 100% 100%; white-space: nowrap; }
      :lang(tr) .stamp { font-size: 60px; }

      .kicker { position: absolute; left: 88px; top: 64px; font-size: 40px; }
      .ev { position: absolute; left: 88px; top: 250px; width: 1100px; font-family: 'Literata', Georgia, serif; font-weight: 500;
            font-size: 76px; line-height: 1.15; letter-spacing: -.012em; }
      .ev .txt { position: relative; display: inline-block; }
      .ev .dbl { left: -1%; width: 102%; top: 100%; height: 56px; }
      .note { left: 1180px; top: 130px; width: 700px; height: auto; transform: rotate(-5deg); }
      .arrowL { left: 1250px; top: 420px; width: 420px; height: auto; transform: rotate(-14deg); --dir: 270deg; }
      .arrowU { --dir: 0deg; }
      :root:not([data-aspect="9x16"]) .arrowU { display: none !important; }   /* portrait-only arrow */
      .slip { left: 88px; bottom: 64px; }
      /* ---- 9:16 (Shorts): bottom 18 % and the right icon column stay free of text ---- */
      :root[data-aspect="9x16"] .kicker { left: 64px; top: 150px; }
      :root[data-aspect="9x16"] .ev { left: 64px; top: 280px; width: 896px; font-size: 68px; }
      :root[data-aspect="9x16"] .arrowL { display: none !important; }
      :root[data-aspect="9x16"] .arrowU { left: 470px; top: 760px; width: 150px; height: auto; }
      :root[data-aspect="9x16"] .note { left: 180px; top: 980px; width: 640px; }
      :root[data-aspect="9x16"] .slip { left: 64px; top: 1260px; bottom: auto; width: 896px; }
    </style>
  </head>
  <body>
    <div id="root" class="oi-c" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div class="grain"></div>

      <div class="kicker mono up" id="kicker"><span class="sect">§</span><span data-chrome="chapter">07 · Test ERA</span></div>
      <div class="ev" id="ev"><span class="txt"><span data-fact="F1" data-layout-allow-occlusion="underlined by hand">Essai randomisé : aucun bénéfice démontré.</span><span class="mk" data-ref="R1" data-field="marker">[1]</span><img class="pen hand dbl" id="dbl" src="assets/hand/underline-double-01.png" alt="" /></span></div>
      <!-- Dr. Aksoy's handwriting: the word is French, so it only appears in the FR version -->
      <img class="pen hand note only-fr" id="note" src="assets/hand/important-fr.png" alt="" />
      <img class="pen hand arrowL only-fr" id="arrowL" src="assets/hand/arrow-left-02.png" alt="" />
      <img class="pen hand arrowU only-fr only-916" id="arrowU" src="assets/hand/arrow-up-01.png" alt="" />
      <div class="slip" id="slip">
        <div class="t" data-ref="R1">[1] Doyle N, et al. JAMA. 2022;328(21):2117-25</div>
        <div data-ref="R1" data-field="design">Essai randomisé multicentrique · n = 767</div>
      </div>
      <audio id="sfx-pen" data-start="1.98" data-duration="0.55" data-track-index="10" data-volume="0.9" src="assets/sfx/pen-01.wav"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const rise = (sel, t, d = 0.45) =>
        tl.fromTo(sel, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: d, ease: 'power3.out' }, t);

      rise('#kicker', 0.2, 0.4); rise('#ev', 0.5, 0.5);
      tl.fromTo('#dbl', { '--p': 0 }, { '--p': 1, duration: 0.6, ease: 'power2.inOut' }, 2.0);
      tl.fromTo('#note', { '--p': 0 }, { '--p': 1, duration: 0.8, ease: 'power1.inOut' }, 3.2);
      tl.fromTo(['#arrowL', '#arrowU'], { '--p': 0 }, { '--p': 1, duration: 0.45, ease: 'power2.out' }, 4.2);
      rise('#slip', 5.2, 0.5);
      tl.to({}, { duration: 0.01 }, 9.99);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
