<!doctype html>
<html lang="fr" data-ink-seed="34738">
  <!-- Série « Les chiffres » — ground: assets/papers/kareli.
       One source, two aspects: this file is 1920×1080; `node ../../tools/aspect.mjs .` writes shorts/ (1080×1920)
       from it, using the :root[data-aspect="9x16"] rules below. Facts: node ../../tools/facts.mjs all . --lang fr
       · phone floor + Shorts UI zone: node ../../tools/legibility.mjs . (and shorts/) -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/pen/pen.css" />
    <link rel="stylesheet" href="assets/papers/papers.css" />
    <link rel="stylesheet" href="assets/components/components.css" />
    <style>
      :root { --W: 1920px; --H: 1080px; --paper: #F2F1EC; --paper-deep: #E8E1D0; --ink: #1B2230; --ink-soft: #4A5263;
               --graphite: #8C877A; --red: #C4301C; }
      :root[data-aspect="9x16"] { --W: 1080px; --H: 1920px; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--W); height: var(--H); overflow: hidden; background: var(--paper); }
      #root { position: relative; width: var(--W); height: var(--H); background: var(--paper); color: var(--ink);
              font-family: 'IBM Plex Sans', system-ui, sans-serif; container-type: size; overflow: hidden; }
      .grain { position: absolute; inset: 0; background: url(assets/textures/paper-grain-16x9.png);
               mix-blend-mode: soft-light; opacity: .30; pointer-events: none; }
      :root[data-aspect="9x16"] .grain { background-image: url(assets/textures/paper-grain-9x16.png); }
      .only-916 { display: none; }
      :root[data-aspect="9x16"] .only-916 { display: block; }
      :root[data-aspect="9x16"] .only-169 { display: none; }
      .serif { font-family: 'Literata', Georgia, serif; }
      .mono  { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
      .sans  { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
      .up    { text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
      .sect  { color: var(--red); margin-right: .45em; }
      .mk    { font-family: 'IBM Plex Mono', monospace; font-size: 40px; font-weight: 500; color: var(--ink-soft); margin-left: 14px; letter-spacing: 0; }
      .slip  { position: absolute; background: var(--paper-deep); border: 1px solid rgba(27,34,48,.14); border-radius: 2px;
               box-shadow: 0 1px 0 rgba(27,34,48,.10); padding: 16px 26px; font-family: 'IBM Plex Mono', monospace;
               font-size: 40px; line-height: 1.32; color: var(--ink-soft); }
      .slip .t { color: var(--ink); font-weight: 500; }
      :root[data-aspect="9x16"] .slip { padding: 12px 22px; line-height: 1.25; }
      .num   { font-weight: 600; letter-spacing: -.03em; font-variant-numeric: lining-nums tabular-nums; }
      .stamp { position: absolute; transform: rotate(calc(-6deg + var(--stamp-rot, 0deg))); border: 7px solid var(--red); border-radius: 2px; color: var(--red);
               font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 70px; letter-spacing: .08em; padding: 14px 34px;
               mix-blend-mode: multiply; -webkit-mask-image: url(assets/textures/stamp-mask.png); mask-image: url(assets/textures/stamp-mask.png);
               -webkit-mask-size: 100% 100%; mask-size: 100% 100%; white-space: nowrap; }
      :lang(tr) .stamp { font-size: 60px; }

      /* kareli geometry: grid origin (42, 27), 54 px cells — every box below is snapped to the grid */
      .kick { left: 150px; --y: 135px; --fs: 40px; }
      .ev   { left: 150px; --y: 297px; --fs: 60px; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; }
      .rule { position: absolute; left: 150px; width: 1512px; background: var(--ink); transform-origin: left; }
      .r-top { top: 404px; height: 3px; } .r-mid { top: 513px; height: 2px; opacity: .55; }
      .r-ab  { top: 675px; height: 2px; opacity: .55; } .r-bot { top: 836px; height: 3px; }
      .vrule { position: absolute; left: 1122px; top: 405px; width: 2px; height: 432px; background: var(--ink); opacity: .55; transform-origin: top; }
      .row { position: absolute; left: 150px; width: 1512px; display: flex; align-items: center; }
      .row .c1 { width: 972px; padding-left: 27px; } .row .c2 { width: 540px; text-align: right; padding-right: 32px; }
      .hdr { top: 405px; height: 108px; font-size: 40px; letter-spacing: .04em; }
      .ra  { top: 513px; height: 162px; } .rb { top: 675px; height: 162px; }
      .lab { font-size: 48px; } .val { font-size: 112px; line-height: 1; }
      .pen-oval { left: 1178px; top: 664px; width: 506px; height: 192px; }
      .slip { left: 150px; top: 891px; }
      /* ---- 9:16 (Shorts): bottom 18 % and the right icon column stay free of text ---- */
      :root[data-aspect="9x16"] .kick { left: 108px; --y: 204px; }
      :root[data-aspect="9x16"] .ev { left: 108px; width: 864px; white-space: normal; --y: 312px; --lh: 108px; }
      :root[data-aspect="9x16"] .rule { left: 108px; width: 864px; }
      :root[data-aspect="9x16"] .r-top { top: 527px; } :root[data-aspect="9x16"] .r-mid { top: 689px; }
      :root[data-aspect="9x16"] .r-ab { top: 851px; } :root[data-aspect="9x16"] .r-bot { top: 1013px; }
      :root[data-aspect="9x16"] .vrule { left: 647px; top: 690px; height: 324px; }
      :root[data-aspect="9x16"] .row { left: 108px; width: 864px; }
      :root[data-aspect="9x16"] .row .c1 { width: 540px; padding-left: 20px; } :root[data-aspect="9x16"] .row .c2 { width: 324px; padding-right: 16px; }
      :root[data-aspect="9x16"] .hdr { top: 528px; height: 162px; }
      :root[data-aspect="9x16"] .hdr .c1 { width: 864px; font-family: 'IBM Plex Sans', sans-serif; text-transform: none; letter-spacing: 0; }
      :root[data-aspect="9x16"] .ra { top: 690px; height: 162px; } :root[data-aspect="9x16"] .rb { top: 852px; height: 162px; }
      :root[data-aspect="9x16"] .lab { font-size: 44px; line-height: 1.15; } :root[data-aspect="9x16"] .val { font-size: 96px; }
      :root[data-aspect="9x16"] .pen-oval { left: 620px; top: 846px; width: 380px; height: 172px; }
      :root[data-aspect="9x16"] .slip { left: 108px; top: 1122px; width: 852px; }
    </style>
  </head>
  <body>
    <div id="root" class="oi-c" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <svg id="pen-warp-defs" width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="pen-warp-1" x="-6%" y="-40%" width="112%" height="180%"><feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="1" seed="418" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G"/></filter></defs></svg>
      <div class="ground ground--kareli"></div>
      <div class="grain"></div>

      <div class="on-rule mono up kick" id="kick"><span class="sect">§</span><span data-chrome="chapter">07 · Test ERA</span></div>
      <div class="on-rule serif ev" id="ev"><span data-fact="F1">Essai randomisé : aucun bénéfice démontré.</span><span class="mk" data-ref="R1" data-field="marker">[1]</span></div>
      <div class="rule r-top" id="rTop"></div><div class="rule r-mid" id="rMid"></div>
      <div class="rule r-ab" id="rAb"></div><div class="rule r-bot" id="rBot"></div>
      <div class="vrule" id="vRule"></div>
      <div class="row hdr mono up" id="hdr"><div class="c1" data-fact="K1">Naissances vivantes par transfert</div></div>
      <div class="row ra" id="ra"><div class="c1 sans lab" data-fact="F2" data-field="label">Transfert guidé par l’ERA</div><div class="c2 serif num val" data-fact="F2">58,5 %</div></div>
      <div class="row rb" id="rb"><div class="c1 sans lab" data-fact="F3" data-field="label">Transfert à horaire standard</div><div class="c2 serif num val" data-fact="F3" data-layout-allow-occlusion="circled by the pen (multiply ink)">61,9 %</div></div>
      <img data-pen="loop" data-pen-tool="round" class="pen pen--loop pen-oval" id="oval" data-layout-allow-occlusion="pen circles the figure (multiply ink)" src="assets/pen/oval-01.png" alt="" data-pen-id="oval-01" style="--pen-rot:1.18deg;--pen-sy:0.98;--pen-fx:1;--pen-warp:url(#pen-warp-1)" />
      <div class="slip" id="slip">
        <div class="t" data-ref="R1">[1] Doyle N, et al. JAMA. 2022;328(21):2117-25</div>
        <div data-ref="R1" data-field="design">Essai randomisé multicentrique · n = 767</div>
      </div>
      <audio data-sfx="pen" id="sfx-pen" data-start="7.08" data-duration="0.55" data-track-index="10" data-volume="0.9" src="assets/sfx/pen-03.wav"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const rise = (sel, t, d = 0.45) =>
        tl.fromTo(sel, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: d, ease: 'power3.out' }, t);

      rise('#kick', 0.2, 0.35);
      rise('#ev', 0.7);
      // the ledger is ruled by hand: each rule drawn left→right, then the column divider
      ['#rTop', '#rMid', '#rAb', '#rBot'].forEach((s, i) =>
        tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: 'power2.inOut' }, 2.3 + i * 0.12));
      tl.fromTo('#vRule', { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: 'power2.out' }, 2.85);
      rise('#hdr', 3.3, 0.4);
      rise('#ra', 3.9); rise('#rb', 4.6);
      rise('#slip', 5.6, 0.5);
      // judgment: the higher figure is the control arm — circled
      tl.fromTo('#oval', { '--p': 0 }, { '--p': 1, duration: 0.7, ease: 'power2.inOut' }, 7.1);
      tl.to({}, { duration: 0.01 }, 9.99);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
