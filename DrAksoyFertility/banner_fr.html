<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  body{width:2560px;height:1440px;overflow:hidden;background:#0c1422;
    font-family:Inter,Segoe UI,sans-serif;color:#f3eee7;position:relative}
  /* Real lab photo (1500x2000), scaled 1.1x; head sits fully inside the mobile safe area (y 508-932) */
  .photo{position:absolute;left:920px;top:-345px;width:1650px;height:2200px;
    background:url('lab_photo_real_clean.jpg') 0 0/100% 100% no-repeat}
  .shade{position:absolute;inset:0;background:
      linear-gradient(90deg, rgba(10,16,28,1) 0%, rgba(10,16,28,1) 38%, rgba(10,16,28,.9) 44%, rgba(10,16,28,.6) 52%, rgba(10,16,28,.15) 62%, rgba(10,16,28,0) 68%),
      linear-gradient(0deg, rgba(10,16,28,.35) 0%, rgba(10,16,28,0) 30%, rgba(10,16,28,0) 70%, rgba(10,16,28,.35) 100%)}
  .safe{position:absolute;left:507px;top:508px;width:1546px;height:424px;
    display:flex;align-items:center;padding:0 60px;box-sizing:border-box}
  .left{width:860px}
  .kicker{font-size:23px;letter-spacing:.22em;text-transform:uppercase;color:#e8a33d;font-weight:600;margin-bottom:12px;white-space:nowrap;text-shadow:0 1px 10px rgba(10,16,28,.9)}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:88px;line-height:1;margin:0 0 14px;letter-spacing:-.01em}
  h1 span{color:#e8a33d}
  .sub{font-size:27px;line-height:1.35;color:#d6cdc1;font-weight:500;margin-bottom:22px;text-shadow:0 1px 12px rgba(10,16,28,.95),0 0 3px rgba(10,16,28,.8)}
.topics{display:flex;align-items:center;gap:12px}
  .topic{border-radius:999px;padding:9px 20px;font-size:21px;font-weight:600;color:#f3eee7;background:rgba(232,163,61,.14);border:1.5px solid rgba(232,163,61,.75)}
  .ladder{display:flex;align-items:center;gap:10px}
  .cap{font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:#9fb0c4;font-weight:600;margin-right:8px;white-space:nowrap}
  .pill{display:flex;align-items:center;gap:8px;border-radius:999px;padding:7px 15px 7px 7px;font-size:20px;font-weight:600}
  .pill b{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-size:18px}
  .p0{background:rgba(43,58,79,.9);color:#9fb0c4}.p0 b{background:#3b4a5f}
  .p1{background:rgba(59,74,95,.9);color:#b8c4d2}.p1 b{background:#4b5a6f}
  .p2{background:rgba(107,90,69,.9);color:#f3eee7}.p2 b{background:#86704f}
  .p3{background:rgba(176,122,58,.95);color:#fff}.p3 b{background:#c68b45}
  .p4{background:#e8a33d;color:#1a1410;box-shadow:0 0 26px rgba(232,163,61,.45)}.p4 b{background:#1a1410;color:#e8a33d}
  .arrow{color:#55657a;font-size:18px}
</style></head>
<body>
<div class="photo"></div><div class="shade"></div>
<div class="safe">
  <div class="left">
    <div class="kicker">Dr Senai Aksoy · Spécialiste de la fertilité</div>
    <h1>Des preuves,<br><span>pas des promesses.</span></h1>
    <div class="sub">Ce qui augmente vraiment vos chances d'avoir un bébé.</div>
    <div class="topics"><div class="topic">FIV</div><div class="topic">Ovocytes</div><div class="topic">Hormones</div><div class="topic">SOPK</div></div>
  </div>
</div>
</body></html>
